[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeagent-mcp"
version = "0.2.0"
description = "Self-healing SDLC pipeline as an MCP plugin — generate, review, debug, and deploy code autonomously."
readme = "readme.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.10.0",  # output_config (effort) and server-side refusal fallbacks
    "python-dotenv>=1.0.1",
    "mcp>=1.2.0,<2",      # mcp 2.x renamed FastMCP; the server doesn't start on it
    "requests>=2.31.0",   # deploy_to_github — GitHub REST API calls
]

[project.scripts]
codeagent = "codeagent_mcp.plugin_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["codeagent_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]
